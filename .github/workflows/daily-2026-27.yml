# MaxPreps daily 2026-27 scrape. In this repo it lives at .github/workflows/daily-2026-27.yml.
#
# Runs on a GitHub-HOSTED Linux runner: no laptop, no VPN. (Verified with test-hosted-runner.yml:
# the hosted runner reaches MaxPreps pages with HTTP 200.)
#
# Every day at 10:00 Pakistan time (05:00 UTC):
#   box scores for yesterday's games (+ retries) -> stats tab for the teams that played
#   -> accumulated + Final files, for all 30 states, boys + girls.
# Sundays also re-read every team schedule (finds newly added / moved games).
# A second trigger 3h later is a no-op when the first one finished.
#
# The existing scraper modules it reuses are bundled in ./core (copied from the old repo, unchanged).
# Data is committed back to this repo's main branch under "Scraped data 2026-27/".
# Limit: a hosted job may run at most 6 hours (a daily run takes roughly 15-90 min).
name: MaxPreps daily 2026-27 (gap finder + stats tab)

on:
  schedule:
    - cron: '0 5 * * *'     # 10:00 PKT
    - cron: '0 8 * * *'     # 13:00 PKT - retry slot; skipped if the 10:00 run already finished
  workflow_dispatch:
    inputs:
      states:
        description: 'Comma list of state codes, e.g. TX,OK (blank = all 30)'
        required: false
        default: ''
      date:
        description: 'Specific game date YYYY-MM-DD (blank = yesterday + catch-up)'
        required: false
        default: ''
      refresh_schedule:
        description: 'Re-read every schedule (finds new games)'
        required: false
        default: 'false'

concurrency:
  group: maxpreps-2026-27-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout this repo (code + data)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily gap finder + stats tab + accumulate
        id: run
        continue-on-error: true
        env:
          IN_STATES: ${{ github.event.inputs.states }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_REFRESH: ${{ github.event.inputs.refresh_schedule }}
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          args=(run_daily.py)
          # a manual run with states/date must not be skipped by the "done today" marker
          if [ -z "$IN_STATES" ] && [ -z "$IN_DATE" ]; then args+=(--skip-if-done-today); fi
          if [ -n "$IN_STATES" ]; then args+=(--states "$IN_STATES"); fi
          if [ -n "$IN_DATE" ]; then args+=(--date "$IN_DATE"); fi
          if [ "$IN_REFRESH" = "true" ] || [ "$(date -u +%u)" = "7" ]; then args+=(--refresh-schedule); fi
          echo "python -u ${args[*]}"
          python -u "${args[@]}"
          rc=$?
          # exit code 1 = some state had a problem; the rest finished, so still commit below
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          exit 0

      - name: Per-state log summary
        if: always()
        run: |
          for f in "Scraped data 2026-27/_logs"/*.log; do
            [ -f "$f" ] && echo "== $(basename "$f" .log): $(grep -E 'Done |ABORT|Traceback|Stats tab:' "$f" | tail -4 | cut -c1-200 | tr '
' '|')"
          done

      - name: Commit data
        run: |
          git config user.name "maxpreps-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- "Scraped data 2026-27"
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "Daily 2026-27 scrape $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail the job if the run step failed
        if: steps.run.outcome == 'failure'
        run: exit 1
